function peaks(L,R,n){n=n||180;const o=new Float32Array(n),N=L.length,st=Math.max(1,Math.floor(N/n));let mx=0;for(let i=0;i<n;i++){let m=0;const a=i*st,e=Math.min(N,a+st),step=Math.max(1,(e-a)>>6);for(let j=a;j<e;j+=step){const v=Math.max(Math.abs(L[j]),Math.abs(R[j]));if(v>m)m=v}o[i]=m;if(m>mx)mx=m}if(mx>0)for(let i=0;i<n;i++)o[i]/=mx;return o}
function sumOf(keys){const N=MX.len,L=new Float32Array(N),R=new Float32Array(N);keys.forEach(k=>{const b=MX.st[k];if(!b)return;const a=b.getChannelData(0),c=b.getChannelData(1);for(let i=0;i<N;i++){L[i]+=a[i];R[i]+=c[i]}});return[L,R]}

  if(onp&&total)onp(Math.min(1,off/total));await Y();
 }

}
const fmtAud=()=>`<div class="mx-out"><h4>صيغة الصوت</h4><div class="mx-fmt">${[['mp3','MP3'],['m4a','M4A · AAC'],['wav','WAV']].map(([k,l])=>`<button data-mx="oa" data-v="${k}" class="${MX.outA===k?'sel':''}">${l}</button>`).join('')}</div></div>`;
const fmtVid=()=>`<div class="mx-out" style="margin-bottom:12px"><h4>صيغة الناتج</h4><div class="mx-fmt"><button data-mx="ov" data-v="video" class="${MX.outV==='video'?'sel':''}">فيديو MP4</button><button data-mx="ov" data-v="audio" class="${MX.outV==='audio'?'sel':''}">صوت فقط</button></div></div>`;
const engNote=()=>MX.eng==='fast'?'نموذج خفيف وسريع، مناسب للكلام والأناشيد.':'نموذج متقدم أدق في عزل الصوت، لكنه أبطأ.';
const durTxt=s=>s<50?'أقل من دقيقة':'نحو '+toArN(Math.max(1,Math.round(s/60)))+' دقيقة';
function sumHtml(){
 if(!MX.on)return '';const n=makePlan(),any=Object.values(n).some(Boolean);let h;
 if(!any)h='لا يوجد فصل مطلوب — المستويات متساوية، سيُحفظ الملف بمستوى صوت واحد.';
 else{const dur=MX.file&&MX.file.dur;const t=estSec(n,dur||60);h=dur?`الوقت التقريبي للمعالجة: <b>${durTxt(t)}</b> (يختلف حسب جهازك).`:`الوقت التقريبي: <b>${durTxt(t)}</b> لكل دقيقة من الملف.`;if(modelsOf(n).some(m=>!MX.dlOk[m]))h+=' سيتم تنزيل مكوّنات المعالجة مرة واحدة فقط.'}
 return ic('clock')+'<span>'+h+'</span>';
}
function refreshSum(){const e=$('#mxSum');if(e)e.innerHTML=sumHtml()}
function vSetup(){
 const f=MX.file,vid=f.vid;
 return `<div class="cd"><div class="mx-file"><div class="mx-fi">${ic(vid?'vid':'aud')}</div><div class="mx-ft"><b><bdi>${esc(f.n)}</bdi></b><small>${vid?'فيديو':'صوت'} · ${fsz(f.s)} · <span id="mxFm">${f.dur?fmt(f.dur):'—'}</span></small></div><button class="mx-chg" data-mx="pick">تغيير</button></div>
 <div class="mx-pv" id="mxPv"></div></div>
 <div class="cd"><div class="mx-mh"><div class="mx-fi">${ic('magic')}</div><div style="flex:1;min-width:0"><h3>إزالة الموسيقى</h3><small id="mxMs">${MX.on?'اختر مستوى كل مسار في الناتج':'فعّل الزر لفصل المسارات والتحكم بكل منها'}</small></div><button class="mx-sw" data-mx="master" aria-pressed="${MX.on}" aria-label="إزالة الموسيقى"></button></div>
 <div class="mx-p${MX.on?' on':''}" id="mxPanel"><div>
  <div class="mx-eng"><div class="tb"><button data-mx="eng" data-v="fast" class="${MX.eng==='fast'?'sel':''}">سريع</button><button data-mx="eng" data-v="hq" class="${MX.eng==='hq'?'sel':''}">دقة عالية</button></div><p class="mx-note" id="mxEngN">${engNote()}</p></div>
  <div class="mx-sum" id="mxSum">${sumHtml()}</div>
  ${ST.map(s=>stemRow(s,{bak:s.k==='nat'})).join('')}
 </div></div></div>
 <div class="cd">${vid?fmtVid():''}${!vid||MX.outV==='audio'?fmtAud():''}<div id="mxAfx"></div></div>
 <button class="go mx-big" id="mxStart" data-mx="start" ${MX.on?'':'disabled'}>${ic('magic')}بدء المعالجة</button><button class="mx-home" data-mx="home">↩ العودة إلى الصفحة الرئيسية</button><div style="height:6px"></div>`;
}
function vWork(){
 const hl=MX.hl;
 return `<div class="cd mx-prog"><div class="mx-ring" id="mxRing"><i></i><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="65"/><circle class="fg" id="mxFg" cx="75" cy="75" r="65" style="stroke-dashoffset:${408*(1-PG.shown/100)}"/></svg><b id="mxPct">٠٪</b></div>
 <h3 id="mxPh">${esc(PG.ph||'جارٍ التحضير…')}</h3>
 ${`<div class="mx-eta">${ic('clock')}المتبقي <b id="mxEta">…</b></div>`}${eqBars()}
 <button class="go cx" data-mx="cancel" style="height:46px;width:100%;margin:0">✕ ${hl?'إلغاء':'إلغاء المعالجة'}</button>
 <button class="go mx-pz${MX.paused?' rs':''}" id="mxPz" data-mx="pz">${MX.paused?ic('play')+' استئناف المعالجة':ic('pause')+' إيقاف مؤقت'}</button>
 ${`<p class="mx-note">يمكنك الخروج من التطبيق أو التنقل بين الصفحات، وتستمر المعالجة في الخلفية.</p><button class="mx-bgn" data-mx="batt">لثبات أكبر في الخلفية: تجاهل توفير البطارية للتطبيق</button>`}</div>`;
}
function vDone(){
 const r=MX.res||{},f=MX.file,miss=missing(),anyMiss=miss.voc||miss.drm||miss.bas||miss.amb;
 const rows=ST.map(s=>{const k=s.k,lock=!rowHave(k);const sub=k==='nat'&&MX.have.bak?'ضوضاء الخلفية + الآهات والأصوات الخلفية':(k==='oth'&&anyMiss?'الباقي (قد يشمل مسارات لم تُفصل بعد)':s.h);return stemRow(s,{lock,menu:true,wave:true,sub})}).join('');
 const bg=MX.bg?`<div class="mx-bgs" id="mxBgS"><div class="mx-spin"></div><span><div id="mxBgT">${esc(MX.bg.txt)} · ${toArN(MX.bg.pct)}٪</div><div class="mx-bgp"><i id="mxBgB" style="width:${MX.bg.pct}%"></i></div></span><button data-mx="bgx">إيقاف</button></div>`:(anyMiss?`<button class="sec" data-mx="split" style="margin-top:12px;width:100%">${ic('magic')}فصل كل المسارات للتحكم الكامل</button>`:'');
 return `<div class="cd"><div class="mx-ok"><div class="mx-fi">${ic('check')}</div><div class="mx-ft"><b>${r.hist?'ملف من السجل':'تمت المعالجة بنجاح'}</b><small><bdi>${esc(f.n)}</bdi>${r.sec?' · استغرقت '+fmt(r.sec):''}</small></div></div>
 <input class="mx-seek" id="mxSeek" type="range" min="0" max="1000" value="0">
 <div class="mx-tm"><span id="mxT0">0:00</span><span id="mxT1">${fmt(MX.dur)}</span></div>
 <div class="mx-tp"><button class="mx-sk" data-mx="skip" data-v="-10" aria-label="رجوع 10 ثوانٍ">${ic('b10')}<b>10</b></button><button class="mx-pb" data-mx="play" id="mxPlay" aria-label="تشغيل النتيجة">${ic('play')}</button><button class="mx-sk" data-mx="skip" data-v="10" aria-label="تقدم 10 ثوانٍ">${ic('f10')}<b>10</b></button></div></div>
 <div class="cd"><div class="mx-mh" style="margin-bottom:2px"><div class="mx-fi">${ic('aud')}</div><div><h3>مازج المسارات</h3><small>اضبط مستوى كل مسار واسمع النتيجة فورًا</small></div></div>${rows}${bg}</div>
 <div class="cd">${f.vid?fmtVid():''}${!f.vid||MX.outV==='audio'?fmtAud():''}
 <div class="mx-act"><button class="mx-save" data-mx="save">${ic('dl')}<span>حفظ الملف النهائي</span></button><button class="mx-new" data-mx="new">ملف جديد</button></div></div>`;
}

/* ---------- نوافذ ---------- */
function openDone(n){
 openSheet(`<div class="bx"><div class="gr"></div><div class="mx-ok" style="margin:6px 0 10px"><div class="mx-fi">${ic('check')}</div><div class="mx-ft"><b>تم الحفظ</b><small><bdi>${esc(n.nm)}</bdi> · ${fsz(n.z)}</small></div></div>
 <button class="mi" data-mx="opn" data-p="${esc(n.p)}" data-i="${esc(n.id)}">${ic('play')}فتح الملف</button><button class="mi" data-mx="shr" data-p="${esc(n.p)}">${ic('share')}مشاركة</button><button class="mi" data-mx="goDl">${ic('dl')}عرض في التحميلات</button><button class="mi" data-mx="shx">${ic('x')}إغلاق</button></div>`);
}
function stemMenu(k){
 const s=SK[k];
 openSheet(`<div class="bx"><div class="gr"></div><div class="mx-mh" style="margin:4px 0 8px"><div class="mx-fi" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})">${ic(SI[k])}</div><div><h3>${s.n}</h3><small>${s.h}</small></div></div>
 <button class="mi" data-mx="solo" data-k="${k}">${ic('solo')}${MX.solo===k?'إلغاء التشغيل المنفرد':'تشغيل هذا المسار منفردًا'}</button>
 <button class="mi" data-mx="mut" data-k="${k}">${ic('mute')}${MX.mute[k]?'إلغاء الكتم (للمعاينة)':'كتم للمعاينة'}</button>
 <button class="mi" data-mx="stem" data-k="${k}">${ic('dl')}تحميل هذا المسار فقط (${MX.outA==='m4a'?'M4A':MX.outA.toUpperCase()})</button>
 <button class="mi" data-mx="shx">${ic('x')}إغلاق</button></div>`);
}

/* ---------- مستويات المسارات ---------- */
let gtm=0;
function setLevel(k,v,fromRange){
 MX.lv[k]=v;MX.on_[k]=v>0;
 const row=document.querySelector(`.mx-row[data-k="${k}"]`);
 if(row){row.classList.toggle('act',v>0&&!row.classList.contains('mx-lock'));const r=row.querySelector('.mx-r'),sw=row.querySelector('[data-mx=tg]'),vv=$('#mxv-'+k);
  if(r){if(!fromRange)r.value=v;r.style.setProperty('--v',v+'%')}if(sw)sw.setAttribute('aria-pressed',v>0);if(vv)vv.textContent=toArN(v)+'٪'}
 if(MX.stage==='setup')refreshSum();else{applyGains();drawWave(k);clearTimeout(gtm);gtm=setTimeout(histUpdateGains,800)}
}
function openTrash(){const b=document.createElement('button');b.dataset.a='trh';b.style.display='none';document.body.appendChild(b);b.click();b.remove()}

/* ---------- الأحداث ---------- */
document.addEventListener('input',e=>{
 const r=e.target;
 if(r.dataset&&r.dataset.mxR){setLevel(r.dataset.mxR,+r.value,1)}
 else if(r.id==='mxSeek'){r._drag=1;const t=r.value/1000*MX.dur;r.style.setProperty('--v',(r.value/10)+'%');const a=$('#mxT0');if(a)a.textContent=fmt(t)}
});
document.addEventListener('change',e=>{const r=e.target;if(r.id==='mxSeek'){r._drag=0;seekTo(r.value/1000*MX.dur)}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-mx]');if(!b)return;const a=b.dataset.mx,k=b.dataset.k;
 switch(a){
  case 'pick':webPick();break; case 'pm':webPick();break;
  case 'home':{const v=$('#mxVid');if(v)v.pause();if(MX.pa)try{MX.pa.pause()}catch(_){}MX.hl=0;resetSession();MX.stage='pick';redraw()}break;
  case 'pz':mxToggle();break;
  case 'vpl':{const v=$('#mxVid');if(v){v.paused?v.play():v.pause()}}break;
  case 'flt':MX.filt=b.dataset.v;document.querySelectorAll('.mx-fl [data-mx=flt]').forEach(x=>x.classList.toggle('on',x.dataset.v===MX.filt));scanRecent().then(l=>{const el=$('#mxRc');if(el)el.innerHTML=recentList(l)});break;
  case 'br':pickBrowse(b.dataset.p);break;
  case 'pp':previewPick(b);break;
  case 'perm':try{Native.allFiles()}catch(_){}break;
  case 'shx':closeSheet();break;
  case 'open':chooseFile(b.dataset.p,b.dataset.s);break;
  case 'ext':try{Native.open('',MX.file.p)}catch(_){}break;
  case 'apl':{const au=MX.pa;if(au){au.paused?au.play():au.pause()}}break;
  case 'master':MX.on=!MX.on;{const p=$('#mxPanel'),st=$('#mxStart'),ms=$('#mxMs');b.setAttribute('aria-pressed',MX.on);if(p)p.classList.toggle('on',MX.on);if(st)st.disabled=!MX.on;if(ms)ms.textContent=MX.on?'اختر مستوى كل مسار في الناتج':'فعّل الزر لفصل المسارات والتحكم بكل منها'}
   if(MX.on){ST.forEach(s=>{const keepV=s.k==='voc';MX.on_[s.k]=keepV;MX.lv[s.k]=keepV?100:0});ST.forEach(s=>setLevel(s.k,MX.lv[s.k]))}refreshSum();vib(10);break;
  case 'tg':{const on=!(MX.on_[k]&&MX.lv[k]>0);setLevel(k,on?(MX.lv[k]>0?MX.lv[k]:100):0);vib(8)}break;
  case 'bak':MX.bakOn=!MX.bakOn;b.setAttribute('aria-pressed',MX.bakOn);refreshSum();break;
  case 'eng':MX.eng=b.dataset.v;keepCfg();document.querySelectorAll('[data-mx=eng]').forEach(x=>x.classList.toggle('sel',x.dataset.v===MX.eng));{const n=$('#mxEngN');if(n)n.textContent=engNote()}refreshSum();break;
  case 'ov':MX.outV=b.dataset.v;if(MX.stage==='done')redrawKeep();else redraw();break;
  case 'oa':MX.outA=b.dataset.v;keepCfg();document.querySelectorAll('[data-mx=oa]').forEach(x=>x.classList.toggle('sel',x.dataset.v===MX.outA));break;
  case 'start':{const v=$('#mxVid');if(v)v.pause();if(MX.pa)MX.pa.pause();start()}break;
  case 'cancel':cancelRun();break;
  case 'batt':try{Native.batt()}catch(_){}break;
  case 'play':if(MX.pl.playing&&!MX.solo)pause();else{MX.solo='';applyGains();play(MX.pl.playing?curTime():null)}break;
  case 'rplay':if(MX.pl.playing&&MX.solo===k)pause();else{MX.solo=k;if(MX.pl.playing){applyGains();uiPlay();drawAllWaves()}else play()}break;
  case 'skip':seekTo(curTime()+(+b.dataset.v));break;
  case 'menu':stemMenu(k);break;
  case 'solo':MX.solo=MX.solo===k?'':k;closeSheet();applyGains();drawAllWaves();toast(MX.solo?'تشغيل منفرد: '+SK[k].n:'عودة للمزج');if(MX.solo&&!MX.pl.playing)play();else uiPlay();break;
  case 'mut':MX.mute[k]=!MX.mute[k];closeSheet();applyGains();drawAllWaves();break;
  case 'stem':exportStem(k);break;
  case 'split':closeSheet();autoSplit(true,k);redrawKeep();break;
  case 'bgx':stopBg();break;
  case 'save':exportFinal();break;
  case 'new':stopPlay();MX.runId++;killMdx();resetSession();MX.stage='pick';MX.file=null;MX.bg=null;redraw();break;
  case 'opn':try{Native.open(b.dataset.i,b.dataset.p)}catch(_){}break;
  case 'shr':try{Native.share(b.dataset.p)}catch(_){toast('تعذرت المشاركة')}break;
  case 'goDl':closeSheet();stopPlay();tab='dl';draw(1);break;
  case 'hopen':{const id=b.dataset.id;if(MX.selM){MX.sel.has(id)?MX.sel.delete(id):MX.sel.add(id);if(!MX.sel.size)MX.selM=0;redraw()}else openHist(id)}break;
  case 'hcx':MX.selM=0;MX.sel.clear();redraw();break;
  case 'hsa':MX.sel=MX.sel.size===HIST.length?new Set():new Set(HIST.map(x=>x.id));redraw();break;
  case 'hdel':{const ids=[...MX.sel];histDelete(ids);MX.selM=0;MX.sel.clear();redraw();toast('نُقل '+toArN(ids.length)+' إلى سلة المهملات')}break;
  case 'htr':openTrash();break;
 }
});
/* سحب/ضغط مطوّل على عناصر السجل */
(()=>{
 let st=null;
 document.addEventListener('pointerdown',e=>{
  const hi=e.target.closest&&e.target.closest('.mx-hi');if(!hi||MX.stage!=='pick')return;
  st={el:hi,x:e.clientX,y:e.clientY,dx:0,mv:0,lp:0,id:hi.dataset.id,w:hi.offsetWidth,pid:e.pointerId};
  st.t=setTimeout(()=>{if(st&&!st.mv&&!MX.selM){st.lp=1;MX.selM=1;MX.sel=new Set([st.id]);vib(15);MX.lpJust=1;redraw()}},520);
 });
 document.addEventListener('pointermove',e=>{
  if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!st.mv&&(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3)&&!MX.selM){st.mv=1;clearTimeout(st.t);st.el.classList.add('drag');try{st.el.setPointerCapture(e.pointerId)}catch(_){}}
  else if(!st.mv&&Math.abs(dy)>10){clearTimeout(st.t);st=null;return}
  if(st.mv){st.dx=Math.max(0,dx);st.el.style.transform=`translateX(${st.dx}px)`;const g=st.dx>st.w*.42,d=st.el.parentNode.querySelector('.mx-hd2');if(d)d.classList.toggle('go',g)}
 });
 const end=e=>{
  if(!st)return;clearTimeout(st.t);const s=st;st=null;
  if(s.mv){s.el.classList.remove('drag');if(s.dx>s.w*.42){s.el.style.transform='translateX(110%)';vib(12);setTimeout(()=>{histDelete([s.id]);redraw();toast('نُقل إلى سلة المهملات')},180)}else s.el.style.transform='';s.el._sw=1;setTimeout(()=>{s.el._sw=0},50)}
  else if(!s.lp){/* ضغطة عادية تُعالج في click */}
 };
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{const hi=e.target.closest&&e.target.closest('.mx-hi');if(hi&&hi._sw){e.stopImmediatePropagation();e.preventDefault()}},true);
 /* ضغط على الصف = فتح */
 document.addEventListener('click',e=>{const hi=e.target.closest&&e.target.closest('.mx-hi');if(!hi||hi._sw||MX.stage!=='pick')return;if(MX.lpJust){MX.lpJust=0;return}const id=hi.dataset.id;if(MX.selM){MX.sel.has(id)?MX.sel.delete(id):MX.sel.add(id);if(!MX.sel.size)MX.selM=0;redraw()}else openHist(id)});
})();
/* سحب على الموجات للتنقل */
(()=>{
 let c=null;const at=e=>{const r=c.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*MX.dur};
 document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('canvas.mx-wv');if(!w)return;c=w;try{w.setPointerCapture(e.pointerId)}catch(_){}seekTo(at(e))});
 document.addEventListener('pointermove',e=>{if(c)seekTo(at(e))});
 const up=()=>{c=null};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
})();
document.addEventListener('click',e=>{const t=e.target.closest('nav button');if(t&&t.dataset.t!=='mx'&&MX.stage==='done')pause()},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&MX.pl.playing)pause()});
window.mxStop=stopPlay;

})();

</script>
</body>
</html>
